[workspace]

[package]
name = "signal_engine_rs"
version = "0.1.0"
edition = "2021"
description = """
Blaque Baux signal engine — Rust hot path via PyO3.

Ports the three latency-critical layers from signal_engine.py:
  Layer 1: EnhancedKalmanFilter   (<0.5ms → <5μs in Rust)
  Layer 2: FastBayesianUpdater    (<0.1ms → <1μs in Rust)
  Stream:  StreamingFeatureEngine (Welford O(1), zero-alloc)
  Cross:   AdaptiveShrinkageEstimator (James-Stein)
  Combine: HybridSignalCombiner (inverse variance weighting)

Python calls Rust via PyO3 — no serialization overhead,
direct numpy array exchange via numpy crate.
"""

[lib]
name = "signal_engine_rs"
crate-type = ["cdylib"]   # shared library for Python import

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"            # zero-copy ndarray ↔ numpy exchange
nalgebra = "0.33"         # linear algebra (Kalman matrices)

[profile.release]
opt-level = 3
lto = true                # link-time optimization — critical for hot path
codegen-units = 1         # single codegen unit for best inlining
strip = true
